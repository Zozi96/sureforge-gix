[package]
name = "sureforge-gix"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "In-process git primitives for the SureForge work-tree fingerprint."

[lib]
name = "sureforge_gix"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["abi3-py39", "generate-import-lib"] }
gix = { version = "=0.89.0", default-features = false, features = ["sha1", "parallel", "status", "dirwalk", "index", "excludes", "attributes"] }

[profile.release]
lto = "thin"
codegen-units = 1
